<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
<style>
.title{font:700 30px Arial;fill:#073b32} .sub{font:500 17px Arial;fill:#52726a}
.city{font:700 17px Arial;fill:#073b32} .small{font:500 13px Arial;fill:#56736c}
.label{font:600 16px Arial;fill:#173f37} .pct{font:800 16px Arial;fill:#073b32}
.track{fill:#e2ebe8} .bar{fill:#0a6b57}
</style>
<rect width="1000" height="720" rx="28" fill="#f8fbfa"/>
<text x="50" y="58" class="title">الخارطة اللغوية الميدانية لمونديال 2034</text>
<text x="50" y="88" class="sub">توزيع الاحتياج بحسب المدن — ثم نموذج تقديري لحصص الطلب اللغوي</text>

<!-- stylized Saudi map -->
<path d="M90 170 L155 125 L245 145 L310 205 L390 225 L445 290 L420 350 L455 410 L410 485 L335 515 L270 475 L215 500 L160 445 L135 380 L90 335 L105 275 Z"
      fill="#0b765f" opacity=".96"/>
<circle cx="310" cy="205" r="8" fill="#d5b56a"/><circle cx="160" cy="445" r="8" fill="#d5b56a"/>
<circle cx="390" cy="400" r="8" fill="#d5b56a"/><circle cx="245" cy="145" r="8" fill="#d5b56a"/><circle cx="270" cy="475" r="8" fill="#d5b56a"/>
<text x="305" y="185" class="city">الرياض</text><text x="118" y="472" class="city">جدة</text>
<text x="398" y="420" class="city">الخبر</text><text x="220" y="128" class="city">نيوم</text><text x="278" y="505" class="city">أبها</text>

<text x="560" y="120" class="city">حصة الطلب الميداني المقدرة حسب اللغة</text>

    <text x="850" y="157" class="label">الإنجليزية</text>
