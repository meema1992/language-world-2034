<line x1="50" y1="625" x2="950" y2="625" stroke="#dbe6e2"/>
<text x="50" y="657" class="small">ملاحظة: نسب الطلب أعلاه نموذج تقديري وارد في مادة البحث وليست إحصاءً رسمياً معلناً.</text>
<text x="50" y="682" class="small">أما المدن واللغات والاحتياجات التشغيلية فهي إطار مقترح لتوجيه التدريب وتوزيع الكفاءات.</text>
